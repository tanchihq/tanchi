[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=/bin/bash -c 'exec $(ls -d /usr/lib/postgresql/*/bin | head -1)/postgres -D "$PGDATA"'
user=postgres
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --save "" --appendonly no --bind 127.0.0.1 --requirepass "%(ENV_REDIS_PASSWORD)s"
user=redis
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/usr/local/bin/api-run.sh
directory=/app/api
user=bun
environment=HOME="/home/bun"
autorestart=true
priority=20
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
